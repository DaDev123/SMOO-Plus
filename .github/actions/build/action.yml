name: Build artifacts

inputs:
  tag:
    description: 'version tag'
    required: false
    default: ''
  prefix:
    description: 'filename prefix'
    required: false
    default: ''

outputs:
  filename-switch:
    description: 'Filename for Switch build artifacts'
    value: ${{ steps.env.outputs.filename-switch }}
  filename-emulators:
    description: 'Filename for Emulator build artifacts'
    value: ${{ steps.env.outputs.filename-emulators }}

runs:
  using: composite
  steps:
    -
      name: Environment
      id: env
      shell: bash
      run: |
        VERS=${{ inputs.tag }}
        PREFIX=${{ inputs.prefix }}
        
        # Set version output
        echo "version=${VERS:1}" >> $GITHUB_OUTPUT
        
        # Set both filenames
        echo "filename-switch=${PREFIX}SMOManHunt${{ (inputs.tag != '' && format('_{0}', inputs.tag)) || '' }}" >> $GITHUB_OUTPUT
        echo "filename-emulators=${PREFIX}SMOManHunt${{ (inputs.tag != '' && format('_{0}', inputs.tag)) || '' }}_Emulators" >> $GITHUB_OUTPUT
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    -
      name: Build environment
      uses: docker/build-push-action@v4
      with:
        pull: true
        push: false
        load: true
        context: .
        file: ./Dockerfile
        tags: smoo-build-env
        platforms: linux/amd64
        cache-from: type=gha,scope=smoo-build-env
        cache-to: type=gha,scope=smoo-build-env,mode=max
    -
      name: Build mod
      shell: bash
      run: |
        docker run --rm \
          -u `id -u`:`id -g` \
          -v "/$PWD/":/app/ \
          ${{ (steps.env.outputs.version != '' && format('-e BUILDVER={0}', steps.env.outputs.version)) || '' }} \
          smoo-build-env
    -
      name: Upload artifacts (Switch)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.env.outputs.filename-switch }}
        path: ./starlight_patch_100/atmosphere/
        if-no-files-found: error
    -
      name: Upload artifacts (Emulators)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.env.outputs.filename-emulators }}
        path: ./starlight_patch_100/SMOO-Plus/
        if-no-files-found: error