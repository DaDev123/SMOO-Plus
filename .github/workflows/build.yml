name: build

on:
  
  push: 
    branches:
      - speedrun-clean
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: alpine
    container:
      image: fruityloops1/alpine-hakkun
    strategy:
      matrix:
        build_type: [Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Compile tools
        run: |
          python sys/tools/setup_sail.py
      - name: Build
        run: |
          cmake -B build -DCMAKE_C_COMPILER_FORCED=TRUE -DCMAKE_CXX_COMPILER_FORCED=TRUE -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"
          cmake --build build -j $(nproc)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.build_type }}
          path: |
            build/*.nss
            build/main.npdm
            build/*.nso
